<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>My Calculator</h1>

    <div class="calculator">
      <div class="display" id="display">0</div>

      <div class="buttons">
        <!-- Row 1 -->
        <button class="clear">clear</button>
        <button class="backspace">‹</button>
        <button>%</button>
        <button class="operator">/</button>

        <!-- Row 2 -->
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>

        <!-- Row 3 -->
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>

        <!-- Row 4 -->
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>

        <!-- Row 5 -->
        <button>0</button>
        <button>.</button>
        <button class="equals">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
